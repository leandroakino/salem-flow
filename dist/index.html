<title>Salém Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: faixa verde institucional no topo, abas de trabalho, área de trabalho clara. Cards de pedido com número grande. */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --surface2:#E9EFE8; --ink:#13211A; --muted:#566559; --line:#D5DDD6;
  --brand:#12432D; --brand-ink:#FFFFFF; --leaf:#2C7A50; --hdr-bg:#12432D; --hdr-ink:#FFFFFF; --overlay:rgba(8,20,13,.5);
  --s-blue:#1D5FD1; --s-violet:#6246C8; --s-amber:#9A5806; --s-orange:#BF3F0B; --s-teal:#0F766E; --s-green:#157A3B; --s-sky:#0369A1; --s-red:#B42318; --s-gray:#566559;
  --ff-display:'Bricolage Grotesque','Inter',system-ui,sans-serif; --ff-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#161F19; --surface2:#1F2B24; --ink:#E6EEE8; --muted:#9AAA9F; --line:#2B3A31;
  --brand:#4FB383; --brand-ink:#06140C; --leaf:#6FCB9C; --hdr-bg:#0A1F15; --hdr-ink:#E6EEE8; --overlay:rgba(0,0,0,.65);
  --s-blue:#86AEFF; --s-violet:#B2A0FF; --s-amber:#F0B45A; --s-orange:#FF9A6B; --s-teal:#4FD1C0; --s-green:#62D58A; --s-sky:#6CC4F0; --s-red:#FF8A7D; --s-gray:#9AAA9F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#161F19; --surface2:#1F2B24; --ink:#E6EEE8; --muted:#9AAA9F; --line:#2B3A31;
  --brand:#4FB383; --brand-ink:#06140C; --leaf:#6FCB9C; --hdr-bg:#0A1F15; --hdr-ink:#E6EEE8; --overlay:rgba(0,0,0,.65);
  --s-blue:#86AEFF; --s-violet:#B2A0FF; --s-amber:#F0B45A; --s-orange:#FF9A6B; --s-teal:#4FD1C0; --s-green:#62D58A; --s-sky:#6CC4F0; --s-red:#FF8A7D; --s-gray:#9AAA9F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ff-body);font-size:15px;line-height:1.45}
body.is-tv{background:#0B120E}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr-bg);z-index:90}
h1,h2,h3{font-family:var(--ff-display);margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:1.25rem} h3{font-size:1.02rem}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:.84rem} .tnum{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .row.end{justify-content:flex-end} .row.between{justify-content:space-between}
.grow{flex:1 1 220px;min-width:0} .stack{display:flex;flex-direction:column;gap:10px}
/* header */
.hdr{background:var(--hdr-bg);color:var(--hdr-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.hdr .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--ff-display);font-weight:700;font-size:1.3rem;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.hdr .sp{flex:1}
.sync{font-size:.8rem;display:flex;align-items:center;gap:6px;opacity:.95}
.dot{width:9px;height:9px;border-radius:50%;background:#62D58A}.dot.warn{background:#F0B45A}.dot.bad{background:#FF8A7D}
.hbtn{background:transparent;border:1px solid color-mix(in srgb,var(--hdr-ink) 40%,transparent);color:var(--hdr-ink);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:36px}
.who{font-size:.9rem}.who b{font-weight:600}
/* nav */
.nav{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer;font-weight:500;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tab[aria-current="page"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.badge{background:var(--s-red);color:#fff;border-radius:999px;font-size:.74rem;padding:1px 7px;font-weight:600}
main{padding-block:6px 40px}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--leaf)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--brand-ink)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{background:var(--s-red);color:#fff;border-color:var(--s-red)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem}
.btn.lg{min-height:52px;padding:12px 22px;font-size:1.02rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.inp,.sel,.txt{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface)}
.txt{min-height:78px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0} .fld>span{font-size:.82rem;font-weight:600;color:var(--muted)}
.fld.err .inp,.fld.err .sel,.fld.err .txt{border-color:var(--s-red)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.toolbar .sel,.toolbar .inp{width:auto;min-width:130px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap}
.chip.solid{background:var(--c);color:var(--surface)}
.c-blue{--c:var(--s-blue)}.c-violet{--c:var(--s-violet)}.c-amber{--c:var(--s-amber)}.c-orange{--c:var(--s-orange)}.c-teal{--c:var(--s-teal)}.c-green{--c:var(--s-green)}.c-sky{--c:var(--s-sky)}.c-red{--c:var(--s-red)}.c-gray{--c:var(--s-gray)}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;cursor:pointer;border-left:6px solid var(--c,var(--line));min-width:0}
.ocard.late{border-color:var(--s-red);border-left-color:var(--s-red)}
.onum{font-family:var(--ff-display);font-weight:700;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.otitle{font-weight:600;overflow-wrap:anywhere}
.ometa{color:var(--muted);font-size:.86rem;display:flex;gap:10px;flex-wrap:wrap}
.cardmsg{font-style:italic;background:var(--surface2);border-radius:8px;padding:6px 9px;font-size:.88rem;overflow-wrap:anywhere}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
/* fotos nos cartões */.ocard .thumbs{margin:4px 0}.ocard .thumbs img{width:68px;height:68px}
#zoom{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}#zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}#zoom span{position:fixed;top:14px;right:18px;color:#fff;font-size:1rem}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);grid-template-rows:minmax(0,1fr);gap:12px;overflow-x:auto;overflow-y:hidden;height:var(--bh,70vh);align-items:stretch;overscroll-behavior-x:contain}
.col{background:var(--surface2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;overflow:hidden}
.col>header{flex:none}.col .cb{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;scrollbar-width:thin;padding-right:2px}
@media (max-width:700px){.board{grid-auto-columns:84vw;scroll-snap-type:x mandatory}.col{scroll-snap-align:start}}
.col>header{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-family:var(--ff-display)}
.col .cnt{background:var(--surface);border-radius:999px;padding:1px 9px;font-size:.82rem}
.empty{color:var(--muted);text-align:center;padding:22px 10px;border:1px dashed var(--line);border-radius:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.low{color:var(--s-red);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:var(--ff-display);font-size:1.55rem;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.82rem}
.bars{display:flex;flex-direction:column;gap:8px}.bar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar i{display:block;height:12px;border-radius:6px;background:var(--leaf);min-width:3px}
.sec{margin-top:22px}.sec>h2{margin-bottom:10px}
.pend{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;flex-wrap:wrap}
.pend .t{flex:1 1 260px;min-width:0;overflow-wrap:anywhere}
.mural{display:flex;flex-direction:column;gap:8px}.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
/* layers */
.layer{position:fixed;inset:0;background:var(--overlay);overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:max(14px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#drawer{z-index:50;justify-content:flex-end;padding:0}#form{z-index:60}#dlg{z-index:70}
.sheet{background:var(--surface);border-radius:16px;width:min(860px,100%);padding:18px;display:flex;flex-direction:column;gap:14px;margin:auto}
.sheet.small{width:min(520px,100%)}
.drawer{background:var(--surface);width:min(580px,100%);min-height:100%;padding:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 28px 18px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:1.35rem}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:.92rem}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.tl{display:flex;flex-direction:column;gap:6px;font-size:.88rem;border-left:2px solid var(--line);padding-left:12px}
.hist{max-height:260px;overflow:auto;font-size:.84rem;display:flex;flex-direction:column;gap:6px}
.checks{display:flex;flex-direction:column;gap:5px;font-size:.88rem}.checks .ok{color:var(--s-green)}.checks .bad{color:var(--s-red)}.checks .warn{color:var(--s-amber)}
.pillbtns{display:flex;gap:8px;flex-wrap:wrap}.pillbtns .btn{border-radius:999px}
.itemrow{display:grid;grid-template-columns:minmax(0,1fr) 84px 110px auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px}
.itemrow .full{grid-column:1/-1}
.matrow{display:grid;grid-template-columns:minmax(0,1fr) 100px auto;gap:8px;margin-bottom:6px}
.radio{display:flex;gap:16px;flex-wrap:wrap}.radio label{display:flex;gap:6px;align-items:center;min-height:36px}
.tot{font-family:var(--ff-display);font-size:1.5rem;font-weight:700}
#toasts{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;max-width:520px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--s-red);color:#fff}
.center{max-width:560px;margin:40px auto}
.userbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
/* ficha de produção, papel de 80 mm */
.slip{width:302px;max-width:100%;background:#fff;color:#000;font-family:'Courier New',Courier,monospace;font-size:13px;line-height:1.35;padding:12px 14px;margin:0 auto;border:1px dashed var(--line)}
.slip .s-h{text-align:center;font-weight:700;letter-spacing:.04em}
.slip .s-n{text-align:center;font-weight:700;font-size:44px;line-height:1.1;margin:6px 0}
.slip .s-b{text-align:center;font-weight:700;border:2px solid #000;margin:6px 0;padding:2px}
.slip hr{border:0;border-top:1px dashed #000;margin:8px 0}
.slip svg{display:block;margin:0 auto;max-width:100%}
.slip .s-i{margin-bottom:5px;font-weight:700}.slip .s-i span{font-weight:400}
.slip .s-f{text-align:center;margin-top:8px}.slip .s-l{font-weight:700;font-size:13px;margin-top:8px;border-top:1px solid #000;padding-top:3px}.slip .s-v{margin-bottom:2px}.slip .s-big{font-weight:700;font-size:16px}.slip .s-f.small{font-size:10px}
/* Painel TV: quadro de produção. Escala por largura da tela (TV 32" e computador), sem zoom */
.tv{--surface:#142019;--surface2:#1B2A21;--ink:#EAF2EC;--muted:#9BB0A2;--line:#27382E;--s-blue:#86AEFF;--s-violet:#B2A0FF;--s-amber:#F0B45A;--s-orange:#FF9A6B;--s-teal:#4FD1C0;--s-green:#62D58A;--s-sky:#6CC4F0;--s-red:#FF8A7D;--bg:#0B120E;--card:#18251D;--card-late:#2D1D1B;--card-soon:#2B2418;
  color:var(--ink);font-family:var(--ff-body);font-size:clamp(14px,.62vw + 8px,30px);height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:.9em;padding:1em 1.2em 1.2em;overflow:hidden}
body.is-tv #view{max-width:none;padding-left:0;padding-right:0}
.tvtop{display:flex;align-items:center;gap:1.4em}
.tvtop .brand{font-family:var(--ff-display);font-weight:700;font-size:1.35em;color:var(--ink);display:flex;align-items:center;gap:.4em;white-space:nowrap}
.tvkpi{display:flex;gap:.6em;flex:1;min-width:0;flex-wrap:wrap}
.kpi{display:flex;align-items:baseline;gap:.5em;padding:.35em .9em;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.95em;color:var(--muted);white-space:nowrap}
.kpi b{font-family:var(--ff-display);font-size:1.5em;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.kpi.k-late.on{background:var(--card-late);border-color:var(--s-red);color:var(--s-red)}.kpi.k-late.on b{color:var(--s-red)}
.kpi.k-soon.on{background:var(--card-soon);border-color:var(--s-orange);color:var(--s-orange)}.kpi.k-soon.on b{color:var(--s-orange)}
.tvclock{text-align:right;line-height:1.05;white-space:nowrap}
.tvclock b{display:block;font-family:var(--ff-display);font-size:2.6em;font-weight:700;font-variant-numeric:tabular-nums}
.tvclock span{font-size:.9em;color:var(--muted)}
.tvctl{display:flex;gap:.4em}.tvbtn{font:inherit;font-size:.8em;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:.6em;padding:.35em .8em;cursor:pointer}.tvbtn:hover,.tvbtn:focus-visible{color:var(--ink);border-color:var(--muted)}
.tvsync{background:var(--s-red);color:#0B120E;font-weight:700;border-radius:999px;padding:.25em .9em;font-size:.85em;white-space:nowrap}
.tvcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1em;min-height:0}
.tvcol{display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:1.1em;overflow:hidden}
.tvch{display:flex;align-items:center;gap:.6em;padding:.8em 1em;border-bottom:1px solid var(--line);flex:none}
.tvch i{width:.8em;height:.8em;border-radius:50%;background:var(--c)}
.tvch h3{font-size:1.25em;flex:1;color:var(--ink)}
.tvch .ct{font-family:var(--ff-display);font-weight:700;font-size:1.5em;min-width:1.9em;text-align:center;padding:0 .4em;border-radius:.6em;background:var(--c);color:#0B120E;font-variant-numeric:tabular-nums}
.tvlist{flex:1;min-height:0;overflow-y:auto;padding:.8em;display:flex;flex-direction:column;gap:.7em;scrollbar-width:none}
.tvlist::-webkit-scrollbar{display:none}
.tvlist.has-more{-webkit-mask-image:linear-gradient(#000 calc(100% - 3em),transparent);mask-image:linear-gradient(#000 calc(100% - 3em),transparent)}
.tvi{position:relative;flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3em .8em;background:var(--card);border-radius:.8em;border-left:.4em solid var(--c);padding:.75em .9em;cursor:pointer}
.tvi.soon{background:var(--card-soon);border-left-color:var(--s-orange)}
.tvi.late{background:var(--card-late);border-left-color:var(--s-red)}
.tvi:hover{outline:1px solid var(--muted)}
.tvh{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:.8em}
.tvh .n{font-family:var(--ff-display);font-weight:700;font-size:2em;line-height:1;font-variant-numeric:tabular-nums}
.tvh .ty{font-size:.85em;color:var(--muted);margin-left:.6em;font-weight:500}
.tvt{text-align:right;line-height:1.1}
.tvt b{display:block;font-family:var(--ff-display);font-size:1.7em;font-variant-numeric:tabular-nums}
.tvt small{font-size:.9em;font-weight:700;color:var(--muted)}
.tvi.soon .tvt small{color:var(--s-orange)}.tvi.late .tvt small,.tvi.late .tvt b{color:var(--s-red)}
.tvb{min-width:0;display:flex;flex-direction:column;gap:.45em}
.it{font-size:1.2em;font-weight:700;line-height:1.25;overflow-wrap:anywhere}.it em{font-style:normal;color:var(--c);margin-right:.3em}
.it .d{display:block;font-size:.85em;font-weight:500;color:var(--muted);margin-top:.1em}
.nt{margin:0;font-size:1em;font-weight:600;color:var(--s-amber);background:rgba(240,180,90,.1);border-radius:.5em;padding:.35em .6em;overflow-wrap:anywhere}
.flag{align-self:flex-start;font-size:.85em;font-weight:700;color:var(--s-red);border:1px solid var(--s-red);border-radius:999px;padding:.05em .7em}
.tvi .ph{width:6.2em;height:6.2em;object-fit:cover;border-radius:.6em;align-self:start;cursor:zoom-in;border:1px solid var(--line)}
.tvempty{margin:auto;text-align:center;color:var(--muted);padding:2em 1em;font-size:1.05em}
@keyframes tvIn{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tvGlow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 .22em var(--c),0 0 1.8em var(--c)}}
.tvi.fx-new,.tvi.fx-moved{animation:tvIn .6s cubic-bezier(.2,.8,.2,1) both,tvGlow 1.2s ease-in-out 4}
.tvtag{position:absolute;top:-.6em;right:.8em;background:var(--c);color:#0B120E;font-weight:800;font-size:.8em;padding:.1em .8em;border-radius:999px}
@media (max-width:900px){.tv{height:auto;overflow:visible}.tvtop{flex-wrap:wrap}.tvcols{grid-template-columns:1fr}.tvlist{overflow:visible}}
@media (prefers-reduced-motion:reduce){.tvi.fx-new,.tvi.fx-moved{animation:none;outline:3px solid var(--c)}}
.tvi.late{outline:3px solid var(--s-red)}
@media (max-width:640px){.itemrow{grid-template-columns:1fr 84px}.itemrow .full{grid-column:1/-1}.kv{grid-template-columns:100px 1fr}.bar{grid-template-columns:80px 1fr auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div id="app">

<script>
(async function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const p2=n=>String(n).padStart(2,'0');
const now=()=>Date.now();
const round=n=>Math.round(n*1000)/1000;
const digits=s=>String(s||'').replace(/\D/g,'');
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>(Number(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const fT=ms=>{const d=new Date(ms);return p2(d.getHours())+':'+p2(d.getMinutes())};
const fD=ms=>{const d=new Date(ms);return p2(d.getDate())+'/'+p2(d.getMonth()+1)};
const fDT=ms=>ms?fD(ms)+' '+fT(ms):'—';
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const todayKey=()=>dayKey(now());
const fDS=s=>s?s.split('-').reverse().slice(0,2).join('/'):'—';
const dur=ms=>ms<60000?'menos de 1 min':ms<3600000?Math.round(ms/60000)+' min':(ms/3600000).toFixed(1).replace('.',',')+' h';

/* ---------- capacidades ---------- */
let db=null,assets=null,dl=null;
try{ if(window.claude&&window.claude.use){ db=await window.claude.use('db'); assets=await window.claude.use('assets'); dl=await window.claude.use('downloads'); } }catch(e){ console.error(e); }
if(!db){
  $('#view').innerHTML='<div class="center card"><h2>Banco de dados indisponível</h2><p class="muted">Abra esta página pelo Claude, com a sua conta conectada, para o Salém Flow acessar o banco de dados compartilhado.</p></div>';
  return;
}

/* ---------- constantes ---------- */
const ST={
  rascunho:{l:'Rascunho',c:'gray'}, liberado:{l:'Liberado',c:'blue'}, aguardando_prod:{l:'Aguardando produção',c:'violet'},
  em_producao:{l:'Em produção',c:'amber'}, aguardando_material:{l:'Aguardando material',c:'orange'}, finalizado:{l:'Finalizado',c:'teal'},
  pronto_subir:{l:'Pronto para subir',c:'green'}, em_transporte:{l:'Em transporte',c:'sky'}, recebido:{l:'Recebido no atendimento',c:'green'},
  divergencia:{l:'Divergência: correção',c:'red'}, bloqueado:{l:'Problema / bloqueio',c:'red'}, saiu_entrega:{l:'Saiu para entrega',c:'sky'},
  entrega_problema:{l:'Problema na entrega',c:'red'}, concluido:{l:'Concluído',c:'gray'}, cancelado:{l:'Cancelado',c:'gray'}
};
const PIPE=['liberado','aguardando_prod','em_producao','aguardando_material','bloqueado','finalizado','pronto_subir','em_transporte','divergencia'];
const CHANNELS={presencial:'Presencial',whatsapp:'WhatsApp',instagram:'Instagram',outro:'Outro'};
const TYPES={retirada:'Retirada',entrega:'Entrega',imediata:'Venda imediata'};
const PAYM={pix:'Pix',dinheiro:'Dinheiro',cartao:'Cartão',transferencia:'Transferência',outro:'Outro'};
const PAYS={pendente:'Pendente',sinal:'Sinal pago',pago:'Pago'};
const LOC={producao:'Produção',reserva:'Reserva da loja',expositor:'Expositor'};
const SCAT=['Flores naturais','Flores artificiais','Embalagens','Papéis','Fitas','Laços','Chocolates','Pelúcias','Vasos','Cachepôs','Adubos','Pedras decorativas','Outros produtos'];
const PCAT=['Buquês','Arranjos','Cestas','Presentes','Plantas','Outros'];
const LOSSM=['Flores murchas','Flores congeladas ou danificadas','Materiais quebrados','Produtos vencidos','Erros de montagem','Outros descartes'];
const DIVT={produto_errado:'Produto errado',danificado:'Produto danificado',qtd_incorreta:'Quantidade incorreta',incompleto:'Pedido incompleto',nao_recebido:'Produto não recebido'};
const ROLES={admin:'Administrador',atendimento:'Atendimento',producao:'Produção',entregador:'Entregador'};
const STALL={liberado:15,aguardando_prod:30,aguardando_material:60,finalizado:15,pronto_subir:20,em_transporte:20,divergencia:30,bloqueado:30,em_producao:180};

/* ---------- estado ---------- */
const COLS={users:null,products:null,clients:null,orders:null,stock:null,replen:null,matreq:['at',200],moves:['at',600],losses:['at',300],confs:['at',100],mural:['at',100],log:['at',500]};
const S={}, loaded={}, pendW={}, cacheOnly={};
Object.keys(COLS).forEach(k=>S[k]={});
let me=null, view='pend', drawerId=null, staleMsg=false, ordersSeen=false;
const lastStatus={};
const arr=c=>Object.values(S[c]);
const R=()=>me&&me.role, isAdm=()=>R()==='admin', canAtt=()=>R()==='atendimento'||R()==='admin', canProd=()=>R()==='producao'||R()==='admin', isDrv=()=>R()==='entregador', mine=o=>!!(o.delivery&&o.delivery.driver===(me&&me.name));

/* ---------- gravação ---------- */
const Q={};
const seq=(key,fn)=>{const p=(Q[key]||Promise.resolve()).catch(()=>{}).then(fn);Q[key]=p;return p;};
const put=(c,i,d)=>seq(c+'/'+i,()=>db.doc(c+'/'+i).set(d));
const patch=(c,i,d)=>seq(c+'/'+i,()=>db.doc(c+'/'+i).update(d));
const del=(c,i)=>seq(c+'/'+i,()=>db.doc(c+'/'+i).delete());
const logEv=(act,detail,ref)=>put('log',uid(),{at:now(),by:me?me.name:'—',role:me?me.role:'',act,detail:detail||'',ref:ref||''});
async function oact(o,pt,...args){
  const cur=S.orders[o.id]||o;
  const entries=(typeof args[0]==='string')?[[args[0],args[1]||'']]:args;
  const h=[...(cur.history||[]),...entries.map(([act,detail])=>({at:now(),by:me.name,role:me.role,act,detail:detail||''}))].slice(-200);
  const extra={history:h,updatedAt:now()};
  if(pt.status&&pt.status!==cur.status) extra.statusAt=now();
  await patch('orders',o.id,{...pt,...extra});
}
async function moveStock({sid,from,to,qty,type,orderId,note,allowNeg,cost}){
  const it=S.stock[sid]; if(!it) throw new Error('Item de estoque não encontrado');
  qty=Number(qty); if(!(qty>0)) throw new Error('Quantidade inválida');
  const q={producao:0,reserva:0,expositor:0,...(it.qty||{})};
  if(from&&from!=='ext'){ if((q[from]||0)<qty&&!allowNeg){const e=new Error('Saldo insuficiente de '+it.name+' em '+LOC[from]);e.neg=true;throw e;} q[from]=round(q[from]-qty); }
  if(to&&to!=='ext') q[to]=round((q[to]||0)+qty);
  await patch('stock',sid,{qty:q});
  await put('moves',uid(),{at:now(),by:me.name,type,sid,name:it.name,unit:it.unit,from:from||'ext',to:to||'ext',qty,orderId:orderId||null,note:note||'',cost:cost!=null?cost:(it.cost||0)});
}
async function nextNum(){
  const ref=db.doc('meta/seq');
  for(let i=0;i<10;i++){
    const r=await ref.acquire({holder:me.id,ttlMs:4000});
    if(r.acquired){
      const s=await ref.get(); const maxO=Math.max(0,...arr('orders').map(o=>o.num||0));
      const n=Math.max((s.exists&&s.data().n)||0,maxO)+1; await ref.set({n}); return n;
    }
    await sleep(250+Math.random()*350);
  }
  throw new Error('Não foi possível gerar o número do pedido agora. Tente novamente.');
}

/* ---------- regras de negócio ---------- */
function deadline(o){
  if(!o.date) return null; const [y,m,d]=o.date.split('-').map(Number); const [hh,mm]=(o.time||'23:59').split(':').map(Number);
  return new Date(y,m-1,d,hh,mm).getTime();
}
const isActive=o=>o.status!=='concluido'&&o.status!=='cancelado'&&o.status!=='rascunho';
const isLate=o=>isActive(o)&&deadline(o)!=null&&now()>deadline(o);
const isSoon=o=>isActive(o)&&!isLate(o)&&deadline(o)!=null&&deadline(o)-now()<90*60000&&PIPE.includes(o.status);
const itemsText=o=>(o.items||[]).map(i=>i.qty+'× '+i.name).join(', ');
const stLabel=o=>o.status==='recebido'?(o.type==='entrega'?'Aguardando entrega':'Aguardando retirada'):o.status==='concluido'?(o.outcome==='entrega'?'Entregue':'Retirada concluída'):ST[o.status].l;
const chip=o=>`<span class="chip c-${ST[o.status].c}">${esc(stLabel(o))}</span>`;
const orderNum=o=>'#'+String(o.num).padStart(4,'0');
const calcSub=items=>items.reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.price)||0),0);
function needFor(o){
  const need={};
  (o.items||[]).forEach(it=>{if(it.direct) return; const p=S.products[it.productId]; if(p&&p.recipe) p.recipe.forEach(r=>{need[r.sid]=round((need[r.sid]||0)+r.qty*it.qty);});});
  return need;
}
const noRecipe=o=>(o.items||[]).filter(it=>{if(it.direct) return false; const p=S.products[it.productId];return !p||!p.recipe||!p.recipe.length;});
const prodItemsText=o=>(o.items||[]).filter(i=>!i.direct).map(i=>i.qty+'× '+i.name).join(', ')||itemsText(o);
const allDirect=items=>items.length>0&&items.every(i=>i.direct);
const skipOf=o=>!!o.noProd||allDirect(o.items||[]);
function directPlan(items){
  const m={};
  (items||[]).forEach(it=>{ if(!it.direct) return; const p=S.products[it.productId]; if(!p||!p.recipe) return; const loc=p.directLoc||'expositor';
    p.recipe.forEach(r=>{ const k=r.sid+'|'+loc; m[k]=m[k]||{sid:r.sid,loc,qty:0}; m[k].qty=round(m[k].qty+r.qty*it.qty); }); });
  return Object.values(m);
}
async function checkDirectStock(plan){
  const short=plan.filter(p=>(((S.stock[p.sid]||{}).qty||{})[p.loc]||0)<p.qty).map(p=>`${(S.stock[p.sid]||{}).name||p.sid}: precisa ${num(p.qty)}, tem ${num((((S.stock[p.sid]||{}).qty||{})[p.loc])||0)} em ${LOC[p.loc]}`);
  if(!short.length) return true;
  if(!isAdm()) throw new Error('Sem estoque no atendimento. '+short.join('; ')+'. Reponha o estoque ou peça ao administrador para autorizar.');
  return confirmDlg('Estoque insuficiente',esc(short.join('; '))+'. Autorizar saldo negativo e liberar mesmo assim?','Autorizar e liberar');
}
async function applyDirect(id,plan,o){ for(const p of plan) await moveStock({sid:p.sid,from:p.loc,to:'ext',qty:p.qty,type:'venda_loja',orderId:id,allowNeg:true,note:'Pedido '+orderNum(o)}); }
async function releaseOrder(cur,pt,ents){
  const plan=directPlan(cur.items), skip=skipOf(cur);
  if(plan.length&&!(await checkDirectStock(plan))) return false;
  const p2={...pt,status:skip?'recebido':'liberado',times:{liberadoAt:now(),...(skip?{recebidoAt:now()}:{})}};
  if(skip){ p2.skipProd=true; p2.receivedBy=me.name; }
  if(plan.length) p2.directUsed=plan;
  await oact(cur,p2,...ents,skip?['Liberado sem produção',plan.length?'Itens do atendimento. Baixa de estoque da loja':'Itens do atendimento']:['Pedido liberado para produção','']);
  await applyDirect(cur.id,plan,cur);
  return true;
}
const totalQty=it=>{const q=it.qty||{};return round((q.producao||0)+(q.reserva||0)+(q.expositor||0));};

function validate(F){
  const e=[]; const B=(k,t)=>e.push({k,t,block:true}), W=(k,t)=>e.push({k,t,block:false});
  if(!F.items.length) B('items','Adicione ao menos um produto');
  F.items.forEach((it,i)=>{
    if(!(Number(it.qty)>0)) B('qty'+i,'Quantidade inválida em "'+it.name+'"');
    const p=S.products[it.productId];
    if(((p&&p.custom)||it.isCustom)&&!String(it.desc||'').trim()) B('desc'+i,'Descreva o item personalizado: '+it.name);
  });
  if(!F.name.trim()) B('name','Informe o nome do cliente');
  if(digits(F.phone).length<8) B('phone','Informe o telefone com DDD');
  if(!F.date) B('date','Defina a data de entrega ou retirada');
  else if(F.date<todayKey()) W('date','A data é anterior a hoje');
  if(!F.time&&!F.noTime) B('time','Defina o horário ou marque "Sem horário marcado"');
  if(F.type==='entrega'&&!F.address.trim()) B('address','Entrega sem endereço');
  if((Number(F.discount)||0)>calcSub(F.items)) B('discount','Desconto maior que o valor dos produtos');
  return e;
}
function newF(){return {id:null,key:uid(),name:'',phone:'',channel:'presencial',type:'retirada',date:todayKey(),time:'',noTime:false,address:'',items:[],photos:[],card:'',cardMsg:'',buildNotes:'',notes:'',payMethod:'pix',payStatus:'pendente',fee:0,discount:0,urgent:false,noProd:false,recipient:'',recipientPhone:''};}
function orderToF(o){return {id:o.id,key:o.key,name:o.client.name,phone:o.client.phone,channel:o.channel,type:o.type,date:o.date,time:o.time||'',noTime:!!o.noTime,address:o.address||'',items:(o.items||[]).map(i=>({...i})),photos:(o.photos||[]).map(p=>({...p})),card:o.card||'',cardMsg:o.cardMsg||'',buildNotes:o.buildNotes||'',notes:o.notes||'',payMethod:o.pay.method,payStatus:o.pay.status,fee:o.fee||0,discount:o.discount||0,urgent:!!o.urgent,noProd:!!o.noProd,recipient:o.recipient||'',recipientPhone:o.recipientPhone||''};}
function fToOrder(F){
  const items=F.items.map(i=>({productId:i.productId||'',name:i.name,category:i.category||'Outros',qty:Number(i.qty)||0,price:Number(i.price)||0,desc:(i.desc||'').trim(),isCustom:!!i.isCustom,direct:!!(S.products[i.productId]&&S.products[i.productId].direct)}));
  const sub=calcSub(items), fee=Number(F.fee)||0, discount=Number(F.discount)||0;
  return {client:{name:F.name.trim(),phone:F.phone.trim()},channel:F.channel,type:F.type,date:F.date,time:F.noTime?'':F.time,noTime:!!F.noTime,address:F.type==='entrega'?F.address.trim():'',items,photos:F.photos,card:F.card,cardMsg:F.card==='com'?F.cardMsg.trim():'',buildNotes:F.buildNotes.trim(),notes:F.notes.trim(),pay:{method:F.payMethod,status:F.payStatus},sub,fee,discount,total:Math.max(0,sub+fee-discount),urgent:!!F.urgent,noProd:!!F.noProd,recipient:(F.recipient||'').trim(),recipientPhone:(F.recipientPhone||'').trim()};
}
async function upsertClient(F){
  const d=digits(F.phone); if(!d) return; const id='c'+d; const cur=S.clients[id]||{};
  await put('clients',id,{name:F.name.trim(),phone:F.phone.trim(),notes:cur.notes||'',createdAt:cur.createdAt||now(),updatedAt:now()});
}
async function saveOrder(F,release){
  const errs=validate(F).filter(x=>x.block);
  if(release&&errs.length) throw new Error('Faltam dados para liberar o pedido');
  if(!F.name.trim()&&!F.items.length) throw new Error('Preencha ao menos o cliente ou um produto');
  const body=fToOrder(F); let savedId=F.id||null;
  if(F.id){
    const cur=S.orders[F.id]; const ent=[]; const pt={...body};
    if(JSON.stringify(cur.items)!==JSON.stringify(body.items)) ent.push(['Itens alterados',itemsText(body)]);
    if(cur.date!==body.date||(cur.time||'')!==body.time) ent.push(['Prazo alterado',`${fDS(cur.date)} ${cur.time||'s/h'} → ${fDS(body.date)} ${body.time||'s/h'}`]);
    if(cur.pay.method!==body.pay.method||cur.pay.status!==body.pay.status||cur.total!==body.total) ent.push(['Pagamento atualizado',`${PAYS[body.pay.status]} · ${money(body.total)}`]);
    if(cur.client.name!==body.client.name||cur.client.phone!==body.client.phone||cur.address!==body.address||(cur.recipient||'')!==body.recipient||(cur.recipientPhone||'')!==body.recipientPhone||cur.card!==body.card||cur.cardMsg!==body.cardMsg||cur.buildNotes!==body.buildNotes||cur.notes!==body.notes||cur.type!==body.type||cur.channel!==body.channel) ent.push(['Pedido editado','Dados do cliente, entrega ou observações']);
    if(!ent.length) ent.push(['Pedido salvo','Sem alterações de conteúdo']);
    if(cur.status==='rascunho'&&release){ if((await releaseOrder({...cur,items:body.items,noProd:body.noProd},pt,ent))===false) return false; }
    else { if(cur.status!=='rascunho') pt.changedAt=now(); await oact(cur,pt,...ent); }
  } else {
    if(arr('orders').some(o=>o.key===F.key)) return true;
    const plan=release?directPlan(body.items):[], skip=release&&skipOf(body);
    if(plan.length&&!(await checkDirectStock(plan))) return false;
    const n=await nextNum(); const id='o'+String(n).padStart(4,'0');
    const hist=[{at:now(),by:me.name,role:me.role,act:'Pedido criado',detail:CHANNELS[body.channel]}];
    if(release) hist.push({at:now(),by:me.name,role:me.role,act:skip?'Liberado sem produção':'Pedido liberado para produção',detail:skip?(body.noProd?'Marcado pelo atendimento':'Itens do atendimento'):''});
    await put('orders',id,{...body,num:n,key:F.key,createdAt:now(),createdBy:me.name,status:release?(skip?'recebido':'liberado'):'rascunho',statusAt:now(),times:release?{liberadoAt:now(),...(skip?{recebidoAt:now()}:{})}:{},...(skip?{skipProd:true,receivedBy:me.name}:{}),...(plan.length?{directUsed:plan}:{}),history:hist,updatedAt:now()});
    await applyDirect(id,plan,{num:n}); savedId=id;
  }
  await upsertClient(F);
  return savedId||true;
}
async function completeProduction(o){
  const cur=S.orders[o.id]; if(cur.stockDone) throw new Error('Este pedido já foi concluído pela produção');
  const need=needFor(cur);
  const neg=Object.entries(need).filter(([sid,q])=>(((S.stock[sid]||{}).qty||{}).producao||0)<q).map(([sid])=>(S.stock[sid]||{}).name||sid);
  const t=now();
  await oact(cur,{status:'pronto_subir',stockDone:true,stockUsed:need,block:null,doneBy:me.name,readyBy:me.name,times:{finalizadoAt:t,prontoAt:t}},
    ['Pronto para subir',Object.keys(need).length?'Baixa de estoque: '+Object.entries(need).map(([s,q])=>q+' '+((S.stock[s]||{}).unit||'')+' '+((S.stock[s]||{}).name||s)).join(', '):'Sem baixa de estoque (produto sem ficha técnica)']
    ,...(neg.length?[['Estoque ficou negativo',neg.join(', ')]]:[]));
  for(const [sid,q] of Object.entries(need)) await moveStock({sid,from:'producao',to:'ext',qty:q,type:'baixa_pedido',orderId:cur.id,allowNeg:true,note:'Pedido '+orderNum(cur)});
  return {ok:true,need,neg};
}

/* ---------- pendências ---------- */
function pendencies(){
  const P=[]; const r=R();
  const add=(sev,text,roles,extra)=>{ if(roles.includes(r)||r==='admin') P.push({sev,text,...extra}); };
  const ALL=['atendimento','producao'];
  arr('orders').forEach(o=>{
    const on=orderNum(o), ref={oid:o.id};
    if(o.status==='rascunho'){ add(1,`${on} é um rascunho ainda não liberado (${o.client?.name||'sem cliente'})`,['atendimento'],ref); return; }
    if(!isActive(o)) return;
    if(isLate(o)) add(3,`${on} atrasado: prazo ${fDS(o.date)} ${o.time||''} · ${stLabel(o)}`,ALL,ref);
    else if(isSoon(o)) add(2,`${on} vence em ${dur(deadline(o)-now())} · ${stLabel(o)}`,ALL,ref);
    if(o.status==='liberado') add(2,`${on} liberado e sem responsável: ${itemsText(o)}`,['producao'],ref);
    if(o.status==='divergencia') add(3,`${on} em correção: ${o.div?.label||''}. ${o.div?.note||''}`,['producao','atendimento'],ref);
    if(o.status==='bloqueado') add(3,`${on} bloqueado: ${o.block?.reason||''}`,o.block?.negAuth?['atendimento']:['producao','atendimento'],{...ref,neg:!!o.block?.negAuth});
    if(o.status==='entrega_problema') add(3,`${on} com problema na entrega: ${o.delivery?.problem||''}`,['atendimento'],ref);
    if(o.status==='pronto_subir') add(1,`${on} pronto, aguardando transporte`,ALL,ref);
    if(o.status==='em_transporte') add(1,`${on} em transporte, aguardando conferência do atendimento`,['atendimento'],ref);
    if((PIPE.includes(o.status)||o.status==='recebido')&&o.card!=='sem'&&!o.cardDone) add(1,`Cartão do ${on}: ${o.card==='com'&&o.cardMsg?'"'+o.cardMsg+'"':'definir a mensagem ou marcar sem cartão'}`,['atendimento'],{...ref,cardDone:true});
    if(o.confReq) add(1,`A produção pediu conferência do ${on}`,['atendimento'],{...ref,clearConf:true});
    const lim=STALL[o.status], ms=o.statusAt||o.createdAt;
    if(lim&&ms&&now()-ms>lim*60000) add(2,`${on} parado há ${dur(now()-ms)} em "${stLabel(o)}"`,ALL,ref);
  });
  arr('stock').forEach(it=>{
    const t=totalQty(it), neg=['producao','reserva','expositor'].some(l=>((it.qty||{})[l]||0)<0);
    if(neg) add(3,`Estoque negativo: ${it.name}`,['producao'],{sid:it.id});
    else if(it.min>0&&t<it.min) add(2,`Estoque abaixo do mínimo: ${it.name} (${num(t)} de ${num(it.min)} ${it.unit})`,['producao'],{sid:it.id});
  });
  arr('replen').forEach(rp=>{
    if(rp.status==='pedida') add(2,`Reposição pedida: ${rp.qty} ${rp.unit} de ${rp.name} (de ${LOC[rp.from]})`,['producao'],{rid:rp.id});
    if(rp.status==='separada') add(2,`Reposição separada: ${rp.qty} ${rp.unit} de ${rp.name}. Confirme o recebimento`,['atendimento'],{rid:rp.id});
  });
  arr('matreq').forEach(m=>{
    const ord=m.orderId&&S.orders[m.orderId], what=`${m.name}${m.qty?' · '+num(m.qty)+' '+(m.unit||''):''}${ord?' (pedido '+orderNum(ord)+')':''}`;
    if(m.status==='aberto') add(2,`Falta de material: ${what}. Avisado por ${m.by}`,['atendimento'],{mid:m.id});
    if(m.status==='providenciado') add(1,`Material providenciado: ${what}. Confirme quando chegar`,['producao'],{mid:m.id});
  });
  return P.sort((a,b)=>b.sev-a.sev);
}

/* ---------- ações disponíveis por status ---------- */
function primaryAction(o){
  const adm=isAdm(), prod=canProd(), att=canAtt();
  switch(o.status){
    case 'rascunho': return att?{a:'o-release',l:'Liberar para produção'}:null;
    case 'liberado': case 'aguardando_prod': return prod?{a:'p-start',l:'Iniciar produção'}:null;
    case 'em_producao': return prod?{a:'p-done',l:'Pronto para subir'}:null;
    case 'aguardando_material': return prod?{a:'p-resume',l:'Material chegou, retomar'}:null;
    case 'bloqueado': if(o.block&&o.block.negAuth) return adm?{a:'a-neg',l:'Autorizar estoque negativo'}:null; return prod?{a:'p-resume',l:'Resolvido, retomar'}:null;
    case 'finalizado': return prod?{a:'p-ready',l:'Pronto para subir'}:null;
    case 'pronto_subir': return (prod||att)?{a:'t-start',l:'Iniciar transporte'}:null;
    case 'em_transporte': return att?{a:'r-receive',l:'Receber e conferir'}:null;
    case 'divergencia': return prod?{a:'p-fix',l:'Corrigido, reenviar'}:null;
    case 'recebido': if(isDrv()) return o.type==='entrega'?{a:'d-out',l:'Peguei para entregar'}:null; return att?(o.type==='entrega'?{a:'d-out',l:'Saiu para entrega'}:{a:'d-pick',l:'Registrar retirada'}):null;
    case 'saiu_entrega': return (att||(isDrv()&&mine(o)))?{a:'d-done',l:isDrv()?'Entreguei':'Confirmar entrega'}:null;
    case 'entrega_problema': return (att||(isDrv()&&mine(o)))?{a:'d-out',l:'Sair novamente'}:null;
  }
  return null;
}
function secondary(o){
  const a=[], att=canAtt(), prod=canProd(), open=isActive(o)||o.status==='rascunho';
  if(att&&open) a.push({a:'o-edit',l:'Editar pedido'});
  if(att&&['liberado','aguardando_prod'].includes(o.status)) a.push({a:'o-direct',l:'Não passa pela produção'});
  if(att&&open&&o.status!=='rascunho'&&o.card!=='sem'&&!o.cardDone) a.push({a:'card-done',l:'Cartão pronto'});
  if(att) a.push({a:'o-dup',l:'Duplicar pedido'});
  if(prod&&o.status==='liberado') a.push({a:'p-accept',l:'Aceitar na fila'});
  if(prod&&['liberado','aguardando_prod','em_producao'].includes(o.status)) a.push({a:'p-wait',l:'Avisar falta de material'},{a:'p-problem',l:'Informar problema'});
  if(prod&&['em_producao','finalizado'].includes(o.status)&&!o.confReq) a.push({a:'p-confreq',l:'Solicitar conferência'});
  if(att&&['pronto_subir','em_transporte'].includes(o.status)) a.push({a:'r-receive',l:'Receber e conferir'});
  if((att||(isDrv()&&mine(o)))&&o.status==='saiu_entrega') a.push({a:'d-prob',l:'Problema na entrega'});
  a.push({a:'o-ficha',l:'Ficha do pedido'});
  if(att&&open) a.push({a:'o-cancel',l:'Cancelar pedido'});
  return a;
}
function flags(o){
  const f=[];
  if(isLate(o)) f.push('<span class="chip c-red solid">Atrasado</span>');
  else if(o.urgent&&isActive(o)) f.push('<span class="chip c-orange solid">Urgente</span>');
  else if(isSoon(o)) f.push('<span class="chip c-amber solid">Prazo próximo</span>');
  if(o.skipProd) f.push('<span class="chip c-gray">Sem produção</span>');
  if(o.changedAt&&PIPE.includes(o.status)&&o.changedAt>((o.times&&(o.times.aceitoAt||o.times.liberadoAt))||0)) f.push('<span class="chip c-violet">Alterado</span>');
  return f.join('');
}
const thumbsHTML=o=>(o.photos&&o.photos.length)?`<div class="thumbs">${o.photos.map(p=>`<img src="/_blob/${esc(p.id)}" alt="Foto de referência" data-act="photo-zoom" data-src="/_blob/${esc(p.id)}">`).join('')}</div>`:'';
function prodCard(o){

function orderRow(o){

function boardScroll(){ const b=document.querySelector('#view .board,#view .tvcols'); if(!b) return null; return {x:b.scrollLeft,c:[...b.querySelectorAll('.col .cb,.tvlist')].map(e=>e.scrollTop),y:window.scrollY}; }

/* ---------- pedidos ---------- */
let PF={q:'',status:'abertos',channel:'',when:'todos',date:'',slot:''};
function pedidosList(){
  let L=arr('orders');
  const q=PF.q.trim().toLowerCase(), qd=digits(PF.q);
  if(q) L=L.filter(o=>String(o.num)===String(Number(qd))||(o.client&&o.client.name.toLowerCase().includes(q))||(o.recipient&&o.recipient.toLowerCase().includes(q))||(qd.length>=4&&digits(o.client&&o.client.phone).includes(qd)));
  if(PF.status==='abertos') L=L.filter(o=>o.status!=='concluido'&&o.status!=='cancelado');
  else if(PF.status==='atrasados') L=L.filter(isLate);
  else if(PF.status!=='todos') L=L.filter(o=>o.status===PF.status);
  if(PF.channel) L=L.filter(o=>o.channel===PF.channel);
  if(PF.when==='hoje') L=L.filter(o=>o.date===todayKey());
  else if(PF.when==='amanha') L=L.filter(o=>o.date===dayKey(now()+864e5));
  else if(PF.when==='data'&&PF.date) L=L.filter(o=>o.date===PF.date);
  if(PF.slot) L=L.filter(o=>{ if(!o.time) return false; const h=Number(o.time.slice(0,2)); return PF.slot==='manha'?h<12:PF.slot==='tarde'?h>=12&&h<18:h>=18; });
  L.sort((a,b)=>PF.status==='abertos'||PF.status==='atrasados'?(deadline(a)||0)-(deadline(b)||0):b.num-a.num);
  if(!L.length) return '<div class="empty">Nenhum pedido encontrado com esses filtros.</div>';
  const groups=[['Rascunhos',['rascunho'],'gray'],['Liberados',['liberado','aguardando_prod'],'blue'],['Em produção',['em_producao','aguardando_material'],'amber'],['Problemas e bloqueios',['bloqueado','divergencia','entrega_problema'],'red'],['Finalizados',['finalizado'],'teal'],['Prontos para subir / em transporte',['pronto_subir','em_transporte'],'green'],['Aguardando retirada ou entrega',['recebido'],'green'],['Saiu para entrega',['saiu_entrega'],'sky'],['Concluídos',['concluido'],'gray'],['Cancelados',['cancelado'],'gray']];
  const shown=L.slice(0,150);
  return `<div class="board">${groups.map(([t,sts,c],i)=>{ const G=shown.filter(o=>sts.includes(o.status)); if(!G.length&&i>=8) return ''; return `<section class="col" style="border-top:4px solid var(--s-${c})"><header><span>${t}</span><span class="cnt">${G.length}</span></header><div class="cb">${G.map(orderRow).join('')||'<div class="empty small">Vazio</div>'}</div></section>`; }).join('')}</div>`;
}

/* ---------- entregador ---------- */
function drvCard(o,k){
  const d=o.delivery||{}, tel=digits(o.client.phone), pend=o.pay&&o.pay.status!=='pago';
  const pa=primaryAction(o), pr=(k==='mine'||k==='prob')&&o.status==='saiu_entrega';
  return `<article class="ocard ${isLate(o)?'late':''}" style="--c:var(--s-${ST[o.status].c})" data-act="o-open" data-id="${o.id}">
    <div class="row between"><span class="onum">${orderNum(o)}</span><span class="row" style="gap:6px">${flags(o)}${chip(o)}</span></div>
    <div class="otitle">${esc(o.recipient||o.client.name)}</div>
    ${o.recipient?`<div class="small muted">Comprador: ${esc(o.client.name)}</div>`:''}
    <div class="small">${esc(o.address||'Sem endereço')}</div>
    <div class="ometa"><span>${fDS(o.date)} ${o.time||'sem horário'}</span><span>${esc(itemsText(o))}</span></div>
    ${pend?`<div class="cardmsg">Pagamento ${PAYS[o.pay.status].toLowerCase()}: combine com o atendimento antes de entregar.</div>`:''}
    ${o.status==='entrega_problema'&&d.problem?`<div class="cardmsg">Problema: ${esc(d.problem)}</div>`:''}
    <div class="row" style="flex-wrap:wrap;gap:8px">
      ${pa?`<button class="btn primary lg" data-act="${pa.a}" data-id="${o.id}">${pa.l}</button>`:''}
      ${pr?`<button class="btn" data-act="d-prob" data-id="${o.id}">Problema</button>`:''}
      ${o.recipientPhone&&digits(o.recipientPhone)?`<a class="btn" data-act="noop" href="tel:${digits(o.recipientPhone)}">Ligar p/ destinatário</a>`:''}${tel?`<a class="btn" data-act="noop" href="tel:${tel}">${o.recipientPhone?'Ligar p/ comprador':'Ligar'}</a>`:''}
    </div></article>`;
}
function viewMinhas(){
  const O=arr('orders'), tk=todayKey(), byDl=(a,b)=>(deadline(a)||9e15)-(deadline(b)||9e15);
  const mineOut=O.filter(o=>o.status==='saiu_entrega'&&mine(o)).sort(byDl);
  const prob=O.filter(o=>o.status==='entrega_problema'&&mine(o)).sort(byDl);
  const wait=O.filter(o=>o.status==='recebido'&&o.type==='entrega').sort(byDl);
  const done=O.filter(o=>o.status==='concluido'&&o.outcome==='entrega'&&o.delivery&&o.delivery.by===me.name&&dayKey((o.times&&o.times.concluidoAt)||0)===tk).sort((a,b)=>b.times.concluidoAt-a.times.concluidoAt);
  const sec=(t,L,k,c,empty)=>`<section class="stack"><h3 class="row between"><span>${t}</span><span class="cnt">${L.length}</span></h3>${L.map(o=>drvCard(o,k)).join('')||`<div class="empty small">${empty}</div>`}</section>`;
  return `<h2 style="margin:6px 0 12px">Minhas entregas</h2><div class="stack" style="max-width:720px">
    ${sec('Comigo agora',mineOut,'mine','sky','Nenhuma entrega com você. Pegue uma na lista abaixo.')}
    ${prob.length?sec('Com problema',prob,'prob','red',''):''}
    ${sec('Prontas para pegar',wait,'wait','green','Nenhuma entrega pronta no momento.')}
    <section class="stack"><h3 class="row between"><span>Entregues hoje</span><span class="cnt">${done.length}</span></h3>${done.map(o=>`<div class="card small"><b>${orderNum(o)}</b> · ${esc(o.client.name)} · recebido por ${esc(o.delivery.receivedBy||'—')} às ${p2(new Date(o.times.concluidoAt).getHours())}:${p2(new Date(o.times.concluidoAt).getMinutes())}</div>`).join('')||'<div class="empty small">Ainda nenhuma hoje.</div>'}</section>
  </div>`;
}

const drivers=(all)=>arr('users').filter(u=>u.role==='entregador'&&(all||u.active!==false)).sort((a,b)=>a.name.localeCompare(b.name));
const driverBusy=u=>arr('orders').filter(o=>(o.status==='saiu_entrega'||o.status==='entrega_problema')&&o.delivery&&o.delivery.driver===u.name);
function viewEntregadores(){
  const D=drivers(true), tk=todayKey(), O=arr('orders');
  const rows=D.map(u=>{
    const busy=driverBusy(u).length, today=O.filter(o=>o.status==='concluido'&&o.outcome==='entrega'&&o.delivery&&o.delivery.driver===u.name&&dayKey((o.times&&o.times.concluidoAt)||0)===tk).length;
    const off=u.active===false;
    return `<tr><td><b>${esc(u.name)}</b></td><td>${off?'<span class="chip c-gray">Removido</span>':'<span class="chip c-green">Ativo</span>'}</td><td class="n">${busy}</td><td class="n">${today}</td><td><div class="row" style="gap:6px">${off?`<button class="btn sm" data-act="dr-on" data-id="${u.id}">Reativar</button>`:`<button class="btn sm" data-act="dr-edit" data-id="${u.id}">Renomear</button><button class="btn sm ghost" data-act="dr-off" data-id="${u.id}">Remover</button>`}</div></td></tr>`;
  }).join('');
  return `<div class="row between"><h2>Entregadores</h2><button class="btn primary" data-act="dr-new">Novo entregador</button></div>
  <p class="muted small" style="margin:6px 0 12px">Quem está aqui aparece na lista "Quem vai entregar" e pode entrar no sistema com o próprio nome. Remover não apaga o histórico de entregas.</p>
  ${D.length?`<div class="tablewrap"><table><thead><tr><th>Nome</th><th>Situação</th><th class="n">Em rota</th><th class="n">Entregues hoje</th><th>Ação</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">Nenhum entregador cadastrado.</div>'}`;
}

/* ---------- entregas ---------- */
function viewEntregas(){
  const O=arr('orders'), tk=todayKey();
  const defs=[['Aguardando retirada',o=>o.status==='recebido'&&o.type!=='entrega','green'],['Aguardando entrega',o=>o.status==='recebido'&&o.type==='entrega','green'],['Saiu para entrega',o=>o.status==='saiu_entrega','sky'],['Problemas na entrega',o=>o.status==='entrega_problema','red'],['Concluídos hoje',o=>o.status==='concluido'&&dayKey((o.times&&o.times.concluidoAt)||0)===tk,'gray']];
  return `<h2 style="margin:6px 0 12px">Entregas e retiradas</h2><div class="board">${defs.map(([t,f,c])=>{
    const L=O.filter(f).sort((a,b)=>(deadline(a)||9e15)-(deadline(b)||9e15));
    return `<section class="col" style="border-top:4px solid var(--s-${c})"><header><span>${t}</span><span class="cnt">${L.length}</span></header><div class="cb">${L.map(orderRow).join('')||'<div class="empty small">Vazio</div>'}</div></section>`;
  }).join('')}</div>`;
}

/* ---------- materiais (comunicação entre setores) ---------- */
const MRST={aberto:['Falta','red'],providenciado:['Providenciado','sky'],resolvido:['Chegou','green'],cancelado:['Cancelado','gray']};
function viewMateriais(){
  const L=arr('matreq');
  const open=L.filter(m=>m.status==='aberto'||m.status==='providenciado').sort((a,b)=>b.at-a.at);
  const done=L.filter(m=>m.status==='resolvido'||m.status==='cancelado').sort((a,b)=>(b.resAt||b.at)-(a.resAt||a.at)).slice(0,15);
  const card=m=>{
    const ord=m.orderId&&S.orders[m.orderId];
    return `<div class="card stack"><div class="row between"><b>${esc(m.name)}${m.qty?' · '+num(m.qty)+' '+esc(m.unit||''):''}</b><span class="chip c-${MRST[m.status][1]}">${MRST[m.status][0]}</span></div>
      <div class="small muted">Avisado por ${esc(m.by)}, ${fDT(m.at)}${ord?` · pedido ${orderNum(ord)}`:''}</div>
      ${m.text?`<div class="cardmsg">${esc(m.text)}</div>`:''}${m.note?`<div class="cardmsg">${esc(m.provBy||'')}: ${esc(m.note)}</div>`:''}
      ${m.status==='providenciado'?`<div class="small muted">Providenciado por ${esc(m.provBy)}, ${fDT(m.provAt)}</div>`:''}${m.status==='resolvido'?`<div class="small muted">Recebido por ${esc(m.resBy)}, ${fDT(m.resAt)}</div>`:''}
      <div class="row">${ord?`<button class="btn sm" data-act="o-open" data-id="${ord.id}">Abrir pedido</button>`:''}
      ${m.status==='aberto'&&canAtt()?`<button class="btn sm primary" data-act="mr-prov" data-id="${m.id}">Providenciado</button>`:''}
      ${m.status!=='resolvido'&&m.status!=='cancelado'&&canProd()?`<button class="btn sm ${m.status==='providenciado'?'primary':''}" data-act="mr-got" data-id="${m.id}">Chegou</button>`:''}
      ${m.status==='aberto'||m.status==='providenciado'?`<button class="btn sm ghost" data-act="mr-cancel" data-id="${m.id}">Cancelar aviso</button>`:''}</div></div>`;
  };
  return `<div class="toolbar"><h2 class="grow">Materiais</h2><button class="btn primary lg" data-act="mr-new">Avisar falta de material</button></div>
    <p class="muted small">A produção avisa o que está faltando, o atendimento marca "Providenciado" e a produção confirma quando chegar. O pedido continua em produção enquanto isso.</p>
    <div class="sec"><h2>Em aberto <span class="muted">(${open.length})</span></h2><div class="list" style="margin-top:10px">${open.map(card).join('')||'<div class="empty">Nenhuma falta de material no momento.</div>'}</div></div>
    ${done.length?`<div class="sec"><h2>Resolvidos recentemente</h2><div class="list" style="margin-top:10px">${done.map(card).join('')}</div></div>`:''}`;
}

/* ---------- estoque ---------- */
let SF={q:'',cat:''};
function stockTable(){
  let L=arr('stock'); const q=SF.q.trim().toLowerCase();
  if(q) L=L.filter(i=>i.name.toLowerCase().includes(q)||(i.code||'').toLowerCase().includes(q));
  if(SF.cat) L=L.filter(i=>i.cat===SF.cat);
  L.sort((a,b)=>a.name.localeCompare(b.name));
  if(!L.length) return '<div class="empty">Nenhum item encontrado. '+(isAdm()?'Use "Novo item" para cadastrar.':'')+'</div>';
  return `<div class="tablewrap"><table><thead><tr><th>Item</th><th class="n">Produção</th><th class="n">Reserva</th><th class="n">Expositor</th><th class="n">Total</th><th class="n">Mínimo</th>${isAdm()?'<th class="n">Valor</th>':''}<th>Ações</th></tr></thead><tbody>${L.map(i=>{
    const q=i.qty||{}, t=totalQty(i), low=i.min>0&&t<i.min;
    return `<tr><td><b>${esc(i.name)}</b><div class="small muted">${esc(i.cat)}${i.code?' · '+esc(i.code):''}${i.locPhys?' · '+esc(i.locPhys):''}</div></td>
      <td class="n ${(q.producao||0)<0?'low':''}">${num(q.producao||0)}</td><td class="n ${(q.reserva||0)<0?'low':''}">${num(q.reserva||0)}</td><td class="n ${(q.expositor||0)<0?'low':''}">${num(q.expositor||0)}</td>
      <td class="n ${low?'low':''}">${num(t)} ${esc(i.unit)}${low?'<div class="small">abaixo do mínimo</div>':''}</td><td class="n">${num(i.min||0)}</td>${isAdm()?`<td class="n">${money(t*(i.cost||0))}</td>`:''}
      <td><div class="row" style="gap:6px"><button class="btn sm" data-act="s-in" data-id="${i.id}">Entrada</button><button class="btn sm" data-act="s-tr" data-id="${i.id}">Transferir</button><button class="btn sm" data-act="s-loss" data-id="${i.id}">Perda</button><button class="btn sm ghost" data-act="s-hist" data-id="${i.id}">Histórico</button>${isAdm()?`<button class="btn sm ghost" data-act="s-edit" data-id="${i.id}">Editar</button>`:''}</div></td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function viewEstoque(){
  const loss=arr('losses').sort((a,b)=>b.at-a.at).slice(0,15);
  const lossTot=arr('losses').reduce((a,l)=>a+(l.cost||0),0);
  return `<div class="toolbar"><h2 class="grow">Controle de estoque</h2><input id="sf-q" class="inp" type="search" placeholder="Buscar item ou código" value="${esc(SF.q)}" aria-label="Buscar item"><select id="sf-cat" class="sel" aria-label="Categoria"><option value="">Todas as categorias</option>${SCAT.map(c=>`<option ${SF.cat===c?'selected':''}>${c}</option>`).join('')}</select>${isAdm()?'<button class="btn primary" data-act="s-new">Novo item</button>':''}<button class="btn" data-act="s-loss" data-id="">Registrar perda</button></div>
    <div id="stbl">${stockTable()}</div>
    <div class="sec"><div class="row between"><h2>Perdas recentes</h2><span class="muted">Total registrado: ${money(lossTot)}</span></div><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Quando</th><th>Item</th><th class="n">Qtd</th><th>Motivo</th><th class="n">Custo</th><th>Quem</th></tr></thead><tbody>${loss.map(l=>`<tr><td>${fDT(l.at)}</td><td>${esc(l.name)}<div class="small muted">${LOC[l.loc]||''}</div></td><td class="n">${num(l.qty)} ${esc(l.unit)}</td><td>${esc(l.motive)}${l.note?`<div class="small muted">${esc(l.note)}</div>`:''}</td><td class="n">${money(l.cost)}</td><td>${esc(l.by)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nenhuma perda registrada.</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- reposições (produção) e expositor ---------- */
const RPST={pedida:['Pedida','violet'],separada:['Separada, aguardando recebimento','teal'],recebida:['Recebida','green'],cancelada:['Cancelada','gray']};
function replenTable(L){
  if(!L.length) return '<div class="empty">Nenhuma reposição.</div>';
  return `<div class="tablewrap"><table><thead><tr><th>Item</th><th class="n">Qtd</th><th>Origem</th><th>Situação</th><th>Pedido por</th><th>Ação</th></tr></thead><tbody>${L.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td class="n">${num(r.qty)} ${esc(r.unit)}</td><td>${LOC[r.from]}</td><td><span class="chip c-${RPST[r.status][1]}">${RPST[r.status][0]}</span></td><td>${esc(r.by)} · ${fDT(r.at)}</td><td>${r.status==='pedida'&&canProd()?`<button class="btn sm primary" data-act="rp-sep" data-id="${r.id}">Separei</button>`:''}${r.status==='separada'&&canAtt()?`<button class="btn sm primary" data-act="rp-rec" data-id="${r.id}">Recebi no expositor</button>`:''}${(r.status==='pedida'||r.status==='separada')&&canAtt()?`<button class="btn sm ghost" data-act="rp-cancel" data-id="${r.id}">Cancelar</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
}
function viewReposicoes(){
  const L=arr('replen').sort((a,b)=>({pedida:0,separada:1,recebida:2,cancelada:3}[a.status]-{pedida:0,separada:1,recebida:2,cancelada:3}[b.status])||b.at-a.at).slice(0,60);
  return `<h2>Reposições do expositor</h2><p class="muted">Pedidos feitos pelo atendimento. Separe os itens e marque "Separei"; o atendimento confirma o recebimento.</p><div style="margin-top:10px">${replenTable(L)}</div>`;
}
function viewExpositor(){
  const showAll=SF.expAll;
  const L=arr('stock').filter(i=>showAll||(i.qty&&i.qty.expositor>0)||i.minExp>0).sort((a,b)=>a.name.localeCompare(b.name));
  const reps=arr('replen').sort((a,b)=>b.at-a.at).slice(0,25);
  const lastC=arr('confs').sort((a,b)=>b.at-a.at)[0];
  return `<div class="toolbar"><h2 class="grow">Expositor</h2><label class="row"><input type="checkbox" id="exp-all" ${showAll?'checked':''}> Mostrar todos os itens</label><button class="btn primary" data-act="conf-new">Conferência do expositor</button></div>
    ${lastC?`<p class="muted small">Última conferência: ${esc(lastC.turno)} por ${esc(lastC.by)}, ${fDT(lastC.at)}${lastC.diffs?` (${lastC.diffs} diferença${lastC.diffs>1?'s':''})`:' (sem diferenças)'}.</p>`:'<p class="muted small">Nenhuma conferência registrada ainda. Faça na abertura, no meio do expediente e no fechamento.</p>'}
    <div class="tablewrap"><table><thead><tr><th>Item</th><th class="n">No expositor</th><th class="n">Reservadas</th><th class="n">Reserva da loja</th><th class="n">Produção</th><th>Ações</th></tr></thead><tbody>${L.map(i=>{
      const q=i.qty||{}, low=i.minExp>0&&(q.expositor||0)<i.minExp;
      return `<tr><td><b>${esc(i.name)}</b><div class="small muted">${esc(i.cat)}</div></td><td class="n ${low?'low':''}">${num(q.expositor||0)} ${esc(i.unit)}${low?`<div class="small">mín. ${num(i.minExp)}: repor</div>`:''}</td><td class="n">${num(i.rsv||0)}</td><td class="n">${num(q.reserva||0)}</td><td class="n">${num(q.producao||0)}</td>
      <td><div class="row" style="gap:6px"><button class="btn sm primary" data-act="rp-new" data-id="${i.id}">Pedir reposição</button><button class="btn sm" data-act="x-sell" data-id="${i.id}">Vendido</button><button class="btn sm" data-act="s-loss" data-id="${i.id}" data-loc="expositor">Descartar</button><button class="btn sm" data-act="x-rsv" data-id="${i.id}">Reservar</button><button class="btn sm ghost" data-act="s-tr" data-id="${i.id}">Transferir</button></div></td></tr>`;
    }).join('')||'<tr><td colspan="6" class="muted">Nenhum item no expositor. Marque "Mostrar todos" ou transfira itens para o expositor.</td></tr>'}</tbody></table></div>
    <div class="sec"><h2>Pedidos de reposição</h2><div style="margin-top:10px">${replenTable(reps)}</div></div>`;
}

/* ---------- clientes ---------- */
let CF='';
function clientsList(){
  const q=CF.trim().toLowerCase(), qd=digits(CF);
  let L=arr('clients'); if(q) L=L.filter(c=>c.name.toLowerCase().includes(q)||(qd.length>=3&&digits(c.phone).includes(qd)));
  const O=arr('orders');
  L.sort((a,b)=>a.name.localeCompare(b.name));
  return L.length?`<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Telefone</th><th class="n">Pedidos</th><th>Último pedido</th><th>Ações</th></tr></thead><tbody>${L.slice(0,200).map(c=>{
    const mine=O.filter(o=>digits(o.client&&o.client.phone)===digits(c.phone)&&o.status!=='cancelado'), last=mine.sort((a,b)=>b.createdAt-a.createdAt)[0];
    return `<tr><td><b>${esc(c.name)}</b>${c.notes?`<div class="small muted">${esc(c.notes)}</div>`:''}</td><td>${esc(c.phone)}</td><td class="n">${mine.length}</td><td>${last?fDT(last.createdAt):'—'}</td><td><div class="row" style="gap:6px"><button class="btn sm primary" data-act="o-new" data-cid="${c.id}">Novo pedido</button><button class="btn sm ghost" data-act="c-edit" data-id="${c.id}">Editar</button></div></td></tr>`;
  }).join('')}</tbody></table></div>`:'<div class="empty">Nenhum cliente cadastrado. Os clientes entram automaticamente quando você salva um pedido.</div>';
}
function viewClientes(){ return `<div class="toolbar"><h2 class="grow">Clientes</h2><input id="cf-q" class="inp" type="search" placeholder="Buscar nome ou telefone" value="${esc(CF)}" aria-label="Buscar cliente"><button class="btn primary" data-act="c-new">Novo cliente</button></div><div id="clist">${clientsList()}</div>`; }

/* ---------- cadastros ---------- */
let CT='produtos';
function viewCad(){
  const tabs=`<div class="pillbtns" style="margin:8px 0 14px"><button class="btn ${CT==='produtos'?'primary':''}" data-act="cad-tab" data-v="produtos">Produtos e fichas técnicas</button><button class="btn ${CT==='usuarios'?'primary':''}" data-act="cad-tab" data-v="usuarios">Usuários</button></div>`;
  if(CT==='usuarios'){
    const U=arr('users').sort((a,b)=>a.name.localeCompare(b.name));

  }
  const P=arr('products').sort((a,b)=>a.name.localeCompare(b.name));
  return `<div class="row between"><h2>Produtos e fichas técnicas</h2><button class="btn primary" data-act="pr-new">Novo produto</button></div>${tabs}<div class="tablewrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th class="n">Preço</th><th>Ficha técnica</th><th>Ação</th></tr></thead><tbody>${P.map(p=>`<tr><td><b>${esc(p.name)}</b>${p.custom?'<div class="small muted">Exige descrição (personalizado)</div>':''}${p.direct?'<div class="small muted">Direto da loja, sem produção</div>':''}${p.active===false?' <span class="chip c-gray">Inativo</span>':''}</td><td>${esc(p.category)}</td><td class="n">${money(p.price)}</td><td class="small">${(p.recipe||[]).map(r=>`${num(r.qty)} ${esc((S.stock[r.sid]||{}).unit||'')} ${esc((S.stock[r.sid]||{}).name||'?')}`).join(', ')||'<span class="muted">Sem ficha: baixa manual</span>'}</td><td><button class="btn sm" data-act="pr-edit" data-id="${p.id}">Editar</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nenhum produto cadastrado.</td></tr>'}</tbody></table></div>`;
}

/* ---------- gestão ---------- */
let DP='mes';
function periodStart(){ const d=new Date(); d.setHours(0,0,0,0); if(DP==='hoje') return d.getTime(); if(DP==='semana'){ d.setDate(d.getDate()-6); return d.getTime(); } if(DP==='mes'){ d.setDate(1); return d.getTime(); } return 0; }
function avg(a){ return a.length?a.reduce((x,y)=>x+y,0)/a.length:0; }
function barsHTML(rows,fmt){ const mx=Math.max(1,...rows.map(r=>r[1])); return `<div class="bars">${rows.map(([l,v,x])=>`<div class="bar"><span>${esc(l)}</span><i style="width:${Math.max(1,v/mx*100)}%"></i><span class="tnum">${fmt(v)}${x?` · ${x}`:''}</span></div>`).join('')||'<span class="muted">Sem dados no período.</span>'}</div>`; }
function viewDash(){
  const t0=periodStart(); const O=arr('orders');
  const sold=O.filter(o=>o.status!=='rascunho'&&o.status!=='cancelado');
  const sum=(from)=>{const L=sold.filter(o=>o.createdAt>=from);return {t:L.reduce((a,o)=>a+o.total,0),n:L.length};};
  const d0=new Date();d0.setHours(0,0,0,0); const w0=d0.getTime()-6*864e5; const m0=new Date(d0.getFullYear(),d0.getMonth(),1).getTime();
  const sd=sum(d0.getTime()), sw=sum(w0), sm=sum(m0);
  const P=sold.filter(o=>o.createdAt>=t0); const tot=P.reduce((a,o)=>a+o.total,0);
  const byCh={}, byCat={}; P.forEach(o=>{ byCh[o.channel]=(byCh[o.channel]||0)+o.total; o.items.forEach(i=>{byCat[i.category]=(byCat[i.category]||0)+i.qty*i.price;}); });
  const act=O.filter(isActive);
  const prodT=P.filter(o=>o.times&&o.times.inicioAt&&o.times.finalizadoAt).map(o=>o.times.finalizadoAt-o.times.inicioAt);
  const lib2ini=P.filter(o=>o.times&&o.times.liberadoAt&&o.times.inicioAt).map(o=>o.times.inicioAt-o.times.liberadoAt);
  const fin2rec=P.filter(o=>o.times&&o.times.finalizadoAt&&o.times.recebidoAt).map(o=>o.times.recebidoAt-o.times.finalizadoAt);
  const retr=P.reduce((a,o)=>a+(o.divCount||0),0);
  const stalled=act.filter(o=>STALL[o.status]&&now()-(o.statusAt||o.createdAt)>STALL[o.status]*60000).length;
  const stock=arr('stock'); const below=stock.filter(i=>i.min>0&&totalQty(i)<i.min); const val=stock.reduce((a,i)=>a+totalQty(i)*(i.cost||0),0);
  const used={}; arr('moves').filter(m=>m.type==='baixa_pedido'&&m.at>=t0).forEach(m=>{used[m.name]=(used[m.name]||0)+m.qty;});
  const usedRows=Object.entries(used).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const lossP=arr('losses').filter(l=>l.at>=t0); const lossFlow=lossP.filter(l=>/flor/i.test(l.motive));
  const buys=arr('moves').filter(m=>m.type==='entrada').sort((a,b)=>b.at-a.at).slice(0,8);
  const occ=arr('mural').filter(m=>m.at>=t0).length+arr('orders').reduce((a,o)=>a+((o.history||[]).filter(h=>h.at>=t0&&/problema|diverg|bloque/i.test(h.act)).length),0);
  const K=(v,l)=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
  return `<div class="row between"><h2>Gestão da operação</h2><div class="row"><div class="pillbtns">${[['hoje','Hoje'],['semana','7 dias'],['mes','Este mês'],['tudo','Tudo']].map(([k,l])=>`<button class="btn sm ${DP===k?'primary':''}" data-act="dp" data-v="${k}">${l}</button>`).join('')}</div></div></div>
    <div class="sec" style="margin-top:14px"><h2>Vendas</h2><div class="kpis" style="margin-top:10px">${K(money(sd.t),'Hoje · '+sd.n+' pedidos')}${K(money(sw.t),'Últimos 7 dias · '+sw.n+' pedidos')}${K(money(sm.t),'Este mês · '+sm.n+' pedidos')}${K(money(P.length?tot/P.length:0),'Ticket médio no período')}</div>
    <div class="grid2" style="margin-top:12px"><div class="card"><h3>Por canal (período)</h3><div style="margin-top:10px">${barsHTML(Object.entries(byCh).map(([k,v])=>[CHANNELS[k]||k,v]).sort((a,b)=>b[1]-a[1]),money)}</div></div><div class="card"><h3>Por categoria (período)</h3><div style="margin-top:10px">${barsHTML(Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,7),money)}</div></div></div></div>
    <div class="sec"><h2>Produção</h2><div class="kpis" style="margin-top:10px">${K(act.filter(o=>['liberado','aguardando_prod'].includes(o.status)).length,'Aguardando produção')}${K(act.filter(o=>['em_producao','aguardando_material'].includes(o.status)).length,'Em andamento')}${K(act.filter(isLate).length,'Atrasados agora')}${K(prodT.length?dur(avg(prodT)):'—','Tempo médio de produção')}${K(P.filter(o=>o.times&&o.times.finalizadoAt).length,'Finalizados no período')}${K(retr,'Divergências e retrabalhos')}</div></div>
    <div class="sec"><h2>Tempos e ocorrências</h2><div class="kpis" style="margin-top:10px">${K(lib2ini.length?dur(avg(lib2ini)):'—','Liberação até início da produção')}${K(fin2rec.length?dur(avg(fin2rec)):'—','Finalização até recebimento')}${K(stalled,'Pedidos sem atualização')}${K(occ,'Ocorrências registradas')}</div></div>
    <div class="sec"><h2>Estoque</h2><div class="kpis" style="margin-top:10px">${K(below.length,'Itens abaixo do mínimo')}${K(money(val),'Valor estimado do estoque')}${K(num(lossFlow.reduce((a,l)=>a+l.qty,0)),'Flores perdidas no período')}${K(money(lossP.reduce((a,l)=>a+(l.cost||0),0)),'Perdas financeiras no período')}</div>
    <div class="grid2" style="margin-top:12px"><div class="card"><h3>Mais utilizados (período)</h3><div style="margin-top:10px">${barsHTML(usedRows,num)}</div></div><div class="card"><h3>Últimas compras</h3><div class="stack small" style="margin-top:10px">${buys.map(b=>`<div class="row between"><span>${esc(b.name)} · ${num(b.qty)} ${esc(b.unit)}</span><span class="muted">${money(b.qty*b.cost)} · ${fDT(b.at)}</span></div>`).join('')||'<span class="muted">Nenhuma entrada registrada.</span>'}</div></div></div></div>
    <div class="sec"><h2>Relatórios</h2><div class="row" style="margin-top:10px"><button class="btn" data-act="exp-orders">Exportar pedidos (CSV)</button><button class="btn" data-act="exp-stock">Exportar estoque (CSV)</button><button class="btn" data-act="exp-losses">Exportar perdas (CSV)</button></div><p class="muted small">Os arquivos CSV abrem direto no Excel. O filtro de período acima vale para os pedidos exportados.</p></div>`;
}

/* ---------- auditoria ---------- */
let AF='';
function auditList(){
  const E=[]; arr('orders').forEach(o=>(o.history||[]).forEach(h=>E.push({at:h.at,by:h.by,act:h.act,detail:h.detail,ref:orderNum(o)})));
  arr('log').forEach(l=>E.push({at:l.at,by:l.by,act:l.act,detail:l.detail,ref:l.ref}));
  arr('moves').forEach(m=>E.push({at:m.at,by:m.by,act:'Estoque: '+m.type.replace(/_/g,' '),detail:`${num(m.qty)} ${m.unit} de ${m.name} (${LOC[m.from]||'fora'} → ${LOC[m.to]||'fora'})${m.note?'. '+m.note:''}`,ref:m.orderId?orderNum(S.orders[m.orderId]||{num:0}):''}));
  const q=AF.trim().toLowerCase();
  const L=E.filter(e=>!q||(e.by+' '+e.act+' '+e.detail+' '+e.ref).toLowerCase().includes(q)).sort((a,b)=>b.at-a.at).slice(0,300);
  return `<div class="tablewrap"><table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Detalhe</th><th>Ref.</th></tr></thead><tbody>${L.map(e=>`<tr><td class="tnum">${fDT(e.at)}</td><td>${esc(e.by)}</td><td>${esc(e.act)}</td><td class="small">${esc(e.detail)}</td><td>${esc(e.ref)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Sem registros.</td></tr>'}</tbody></table></div>`;
}
function viewAudit(){ return `<div class="toolbar"><h2 class="grow">Auditoria</h2><input id="af-q" class="inp" type="search" placeholder="Filtrar por pessoa, ação ou pedido" value="${esc(AF)}" aria-label="Filtrar auditoria"></div><p class="muted small">Mostra os 300 registros mais recentes. Nada é apagado: pedidos são cancelados e o estoque é estornado, com histórico.</p><div id="alist">${auditList()}</div>`; }

/* ---------- painel de TV ---------- */
let tvPrev=null, tvPrevAt=0; const tvFx={};
function tvTrack(panels){
  const t=now(), cur={};
  panels.forEach(([,,L],pi)=>L.forEach(o=>{ (cur[o.id]=cur[o.id]||[]).push(pi); }));
  if(tvPrev&&t-tvPrevAt<300000){
    Object.entries(cur).forEach(([id,ps])=>{ const was=tvPrev[id]; ps.forEach(pi=>{ if(!was||!was.includes(pi)){ const k=tvFx[id+'|'+pi]; if(!k||t-k.at>8000) tvFx[id+'|'+pi]={k:was?'moved':'new',at:t}; } }); });
  }
  Object.keys(tvFx).forEach(k=>{ if(t-tvFx[k].at>9000) delete tvFx[k]; });
  tvPrev=cur; tvPrevAt=t;
}
const fmtMin=m=>m<60?m+' min':Math.floor(m/60)+'h'+(m%60?p2(m%60):'');
function tvWhen(dl){ if(dl==null) return {k:'',t:''}; const m=Math.round((dl-now())/60000); return m<0?{k:'late',t:'Atrasado '+fmtMin(-m)}:m<90?{k:'soon',t:'em '+fmtMin(m)}:{k:'',t:'no prazo'}; }
function tvCard(o,c,pi){
  const fx=tvFx[o.id+'|'+pi], el=fx?now()-fx.at:0, dl=deadline(o), w=tvWhen(dl), on=fx&&el<8000;
  const its=(o.items||[]).filter(i=>!i.direct);
  const rows=its.length?its.map(i=>`<div class="it"><em>${esc(i.qty)}×</em>${esc(i.name)}${i.desc?`<span class="d">${esc(i.desc)}</span>`:''}</div>`).join(''):`<div class="it">${esc(prodItemsText(o))}</div>`;
  const flag=o.status==='aguardando_material'?'Falta material':o.status==='bloqueado'?'Bloqueado':'';
  const ph=o.photos&&o.photos.length?`<img class="ph" src="/_blob/${esc(o.photos[0].id)}" alt="Foto de referência" data-act="photo-zoom" data-src="/_blob/${esc(o.photos[0].id)}">`:'';
  return `<article class="tvi ${w.k} ${on?'fx-'+fx.k:''}" ${on?`style="animation-delay:${-el}ms,${600-el}ms"`:''} data-act="o-open" data-id="${o.id}">${on?`<span class="tvtag">${fx.k==='new'?'NOVO':'MOVIDO'}</span>`:''}
    <div class="tvh"><span><span class="n">${orderNum(o)}</span><span class="ty">${o.type==='entrega'?'Entrega':'Retirada'}</span></span><span class="tvt"><b>${esc(o.time||'--:--')}</b><small data-dl="${dl==null?'':dl}">${w.t}</small></span></div>
    <div class="tvb">${rows}${flag?`<span class="flag">${flag}</span>`:''}${o.buildNotes?`<p class="nt">Montagem: ${esc(o.buildNotes)}</p>`:''}</div>${ph}</article>`;
}
function viewTV(){
  const O=arr('orders').filter(o=>PIPE.includes(o.status)&&isActive(o));
  const sort=L=>L.sort((a,b)=>(deadline(a)||9e15)-(deadline(b)||9e15));
  const panels=[['Aguardando produção','violet',sort(O.filter(o=>['liberado','aguardando_prod'].includes(o.status)))],['Em produção','amber',sort(O.filter(o=>['em_producao','aguardando_material','bloqueado'].includes(o.status)))],['Prontos para subir','green',sort(O.filter(o=>['finalizado','pronto_subir','em_transporte'].includes(o.status)))]];
  tvTrack(panels);
  const late=O.filter(isLate).length, soon=O.filter(isSoon).length, ctl=!!me;
  const stale=!navigator.onLine||staleMsg;
  return `<div class="tv"><div class="tvtop"><div class="brand">${LEAF}Produção</div>
    <div class="tvkpi"><span class="kpi k-late ${late?'on':''}"><b>${late}</b>atrasados</span><span class="kpi k-soon ${soon?'on':''}"><b>${soon}</b>perto do prazo</span><span class="kpi"><b>${O.length}</b>no fluxo</span>${stale?'<span class="tvsync">Sem conexão: dados podem estar desatualizados</span>':''}</div>
    <div class="tvclock"><b id="tvclock"></b><span id="tvdate"></span></div>
    ${ctl?`<div class="tvctl"><button class="tvbtn" data-act="tv-full">Tela cheia</button><button class="tvbtn" data-act="nav" data-v="${NAV[R()][0]}">Sair do painel</button></div>`:''}</div>
    <div class="tvcols">${panels.map(([t,c,L],pi)=>`<section class="tvcol" style="--c:var(--s-${c})"><div class="tvch"><i></i><h3>${t}</h3><span class="ct">${L.length}</span></div><div class="tvlist">${L.map(o=>tvCard(o,c,pi)).join('')||'<div class="tvempty">Nenhum pedido nesta etapa</div>'}</div></section>`).join('')}</div></div>`;
}
let tvIdle=Date.now();
['pointermove','wheel','touchstart','keydown','pointerdown'].forEach(e=>document.addEventListener(e,()=>{ tvIdle=Date.now(); },{passive:true,capture:true}));
function tvTick(){
  if(view!=='tv') return;
  const d=new Date(), c=$('#tvclock'); if(!c) return;
  c.textContent=p2(d.getHours())+':'+p2(d.getMinutes());
  try{ $('#tvdate').textContent=d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,''); }catch(e){}
  document.querySelectorAll('.tv .tvi small[data-dl]').forEach(s=>{ const dl=s.dataset.dl; const w=tvWhen(dl===''?null:+dl); s.textContent=w.t; const card=s.closest('.tvi'); card.classList.toggle('late',w.k==='late'); card.classList.toggle('soon',w.k==='soon'); });
  document.querySelectorAll('.tv .tvlist').forEach(l=>l.classList.toggle('has-more',l.scrollHeight>l.clientHeight+4&&l.scrollTop+l.clientHeight<l.scrollHeight-4));
}
setInterval(tvTick,15000);
const tvScr=new Map();
setInterval(()=>{ if(view!=='tv'||drawerId||Date.now()-tvIdle<30000) return;
  document.querySelectorAll('.tv .tvlist').forEach(l=>{ if(l.scrollHeight<=l.clientHeight+4) return; const s=tvScr.get(l)||{w:0}; tvScr.set(l,s); const t=Date.now(); if(t<s.w) return;
    if(l.scrollTop+l.clientHeight>=l.scrollHeight-2){ s.w=t+4000; if(!s.back){ s.back=true; return; } s.back=false; l.scrollTop=0; s.w=t+4000; return; } s.back=false; l.scrollTop+=1; });
  tvTick(); },40);

/* ---------- camadas, avisos, diálogos ---------- */
const LY=id=>document.getElementById(id);
function openLayer(id,html){ const l=LY(id); l.innerHTML=html; l.hidden=false; }
function closeLayer(id){ const l=LY(id); l.hidden=true; l.innerHTML=''; if(id==='drawer') drawerId=null; }
function toast(msg,err){ const d=document.createElement('div'); d.className='toast'+(err?' err':''); d.textContent=msg; $('#toasts').appendChild(d); setTimeout(()=>d.remove(),err?6500:4200); }
async function run(fn){ try{ await fn(); }catch(e){ console.error(e); toast(e&&e.message?e.message:'Não foi possível concluir. Tente novamente.',true); } }

function fieldHTML(f){
  const id='q-'+f.id, v=f.value==null?'':f.value;
  if(f.type==='note') return `<p class="muted">${f.html}</p>`;
  if(f.type==='checkbox') return `<label class="row"><input type="checkbox" id="${id}" ${f.value?'checked':''}> ${esc(f.label)}</label>`;
  let ctl;
  if(f.type==='select') ctl=`<select class="sel" id="${id}">${(f.options||[]).map(o=>{const ov=typeof o==='object'?o.v:o, ol=typeof o==='object'?o.l:o; return `<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`;}).join('')}</select>`;
  else if(f.type==='textarea') ctl=`<textarea class="txt" id="${id}">${esc(v)}</textarea>`;
  else ctl=`<input class="inp" id="${id}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" ${f.type==='number'?'step="any" min="0"':''} value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''} autocomplete="off">`;
  return `<label class="fld"><span>${esc(f.label)}${f.required?' *':''}</span>${ctl}</label>`;
}
function ask(o){
  return new Promise(res=>{
    const f=o.fields||[];
    openLayer('dlg',`<div class="sheet small" role="dialog" aria-modal="true"><h2>${esc(o.title)}</h2>${o.note?`<p class="muted">${o.note}</p>`:''}<form id="askf" class="stack">${f.map(fieldHTML).join('')}<div class="row end"><button type="button" class="btn" data-x="cancel">Cancelar</button><button class="btn ${o.danger?'danger':'primary'}">${esc(o.ok||'Confirmar')}</button></div></form></div>`);
    const close=v=>{closeLayer('dlg');res(v);};
    $('#askf').onsubmit=e=>{
      e.preventDefault(); const v={};
      for(const fl of f){
        if(fl.type==='note') continue; const el=$('#q-'+fl.id);
        v[fl.id]=fl.type==='checkbox'?el.checked:fl.type==='number'?(el.value===''?0:Number(el.value)):el.value.trim();
        if(fl.required&&(fl.type==='number'?!(v[fl.id]>0):!v[fl.id])){ toast('Preencha: '+fl.label,true); el.focus(); return; }
      }
      close(v);
    };
    $('#askf [data-x=cancel]').onclick=()=>close(null);
    const first=$('#askf input:not([type=checkbox]),#askf select,#askf textarea'); if(first) first.focus();
  });
}
const confirmDlg=(title,note,ok,danger)=>ask({title,note,ok,danger,fields:[]}).then(v=>!!v);
